## TODO: make sure to set podman compose as default provider
## export PODMAN_COMPOSE_PROVIDER="$(command -v podman-compose)"

services:
  notebook:
    build:
      context: ./ci/docker-notebook
    # image: quay.io/jupyter/base-notebook:ubuntu-24.04
    # Custom base image with yoga1290.rag[infrastructure-local-llama-postgres]
    depends_on:
      postgres:
        condition: service_healthy
      sidecar-db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8888:8888" # Jupyter
    volumes:
      - ./:/home/jovyan/work
      - ~/LLM:/LLM
    networks:
      - public
      - private

  ###########################################
  # MONITORED JOB
  ###########################################
  monitored-job:
    container_name: monitored-job
    depends_on:
      - prometheus
      - grafana
    build:
      context: ./ci/docker-telegraf-python
    networks:
      - monitoring
      - public
    command:
      - /bin/bash
      - -c
      - |
        set -e

        # pip install yoga1290.rag

        echo "Starting Telegraf..."
        telegraf --config /etc/telegraf/telegraf.conf &

        echo "Starting receipt extraction..."
        python app.py
        wait 50000
    ports:
      - "9273:9273"
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./demo-app:/app:ro
      - ./documents:/app/documents
      - ./observability/telegraf.conf:/etc/telegraf/telegraf.conf

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - public
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-yoga1290}"
    networks:
      - monitoring
      - public
    restart: unless-stopped

  ###########################################
  # POSTGRESQL
  ###########################################
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  sidecar-db-init:
    image: docker.io/library/postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./initdb:/sql:ro
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql \
          "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}" \
          -f /sql/001-init.sql
    restart: "no"
    networks:
      - private

  ###########################################
  # DOCUMENT INGESTION
  ###########################################
  pull-documents:
    image: ghcr.io/yoga1290/python-emailtable:26.10
    # container_name: pull-documents-imap
    env_file:
      - .env
    environment:
      OUTPUT_DIR: "${DOCUMENTS_PATH}"
      # FROM_EMAIL: you@example.com
      TO_EMAIL: "youssef.shehab03@gmail.com"
      MAILBOX: "[Gmail]/Starred"
      # MAILBOX: INBOX
    volumes:
      - "./${DOCUMENTS_PATH}:/usr/app/${DOCUMENTS_PATH}"
    networks:
      - public

###########################################
# NETWORKS
###########################################
networks:
  public:
  private:
    internal: true
  monitoring:
    internal: true

###########################################
# PERSISTENT VOLUMES
###########################################
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:


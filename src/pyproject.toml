[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "yoga1290.rag"
readme = "readme.md"
version = "0.1.31"
description = "Hexagonal Architecture for Provider-Agnostic RAG Pipelines"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["./"]

[project.urls]
Homepage = "https://github.com/yoga1290/rag"
Issues = "https://github.com/yoga1290/rag/issues"

[project.optional-dependencies]

# Document processing
documents = [
    "pypdf>=4.0",
    "unstructured==0.21.5",
    "langchain==1.0.8",
    "langchain-unstructured==1.0.1",
    "sentence-transformers==5.1.2",
]

# PostgreSQL and vector storage
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "sqlalchemy>=2.0",
]

# Local LLM support
llama-cpp = [
    "llama-cpp-python==0.3.16",
    "langchain==1.0.8",
    "langchain-community==0.4.1",
    "langchain-unstructured==1.0.1"
]

#########################
#### infrastructures ####
#########################

# local infrastructure implementation using llama & postgres
infrastructure-local-llama-postgres = [
    "yoga1290-rag[documents,postgres,llama-cpp]",
]

##################################################

# Convenient bundle containing all optional components
all = [
    "yoga1290-rag[documents,postgres,llama-cpp]",
]